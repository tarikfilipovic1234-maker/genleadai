# Lead scoring rules.
#
# Editable without touching Python, which is the point: what makes a lead
# valuable is a commercial judgement that changes per campaign, not a fact
# about the code. Change a weight here and re-score - no redeploy.
#
# Condition vocabulary (see app/scoring/engine.py):
#   fact:      name of a LeadFacts attribute
#   equals:    the fact's value must equal this
#   present:   true  -> the fact must be known (verified or inferred)
#              false -> the fact must be unverified or absent
#   verified:  true  -> only a directly sourced fact counts
#   signal:    name of a SiteSignals attribute
#   lt / gte:  numeric comparison against a signal
#
# A rule whose condition cannot be evaluated simply does not fire. Nothing is
# awarded on a guess.

version: 1
max_score: 100

# Profiles let one task ask a stricter question than another without editing
# the rules. A profile names rules that are *mandatory*: a lead that fails one
# is disqualified rather than merely scoring lower.
#
# This is the difference between "rank salons by how good a prospect they are"
# and "find salons that do not have online booking". A 90-point lead that
# happens to use Booksy is not a near miss for the second question - it is the
# wrong answer, and burying it at position four of a ranked list still wastes
# the user's time.
profiles:
  default:
    description: Rank every candidate; disqualify nothing.
    requires: []

  no_online_booking:
    description: >-
      Only businesses with no online booking. The rule must have actually
      fired, so a business whose website could not be read is excluded -
      its booking status is unknown, and unknown is not the same as absent.
    requires: [no_online_booking]

  no_booking_with_social:
    description: No online booking and a reachable social presence.
    requires: [no_online_booking, active_instagram]

rules:
  - id: no_online_booking
    points: 30
    reason: "No online booking system found on their website"
    when:
      fact: has_online_booking
      equals: false
    # The premise of the product. Weighted highest because it is the actual
    # sales opening, and because it is the hardest signal to establish - it
    # requires having reached and read the site.

  - id: active_instagram
    points: 15
    reason: "Active Instagram presence"
    when:
      fact: instagram
      present: true

  - id: outdated_website
    points: 15
    reason: "Website looks dated and is likely due a rebuild"
    when:
      signal: copyright_year
      lt: 2023
    # A stale copyright year is the most reliable cheap proxy for a site
    # nobody has touched in years.

  - id: not_mobile_friendly
    points: 10
    reason: "Website is not mobile-responsive"
    when:
      signal: mobile_friendly
      equals: false

  - id: website_exists
    points: 10
    reason: "Has a website to work with"
    when:
      fact: website
      present: true

  - id: contactable
    points: 10
    reason: "Direct contact details are available"
    when:
      any:
        - fact: phone
          verified: true
        - fact: email
          verified: true

  - id: category_match
    points: 10
    reason: "Matches the requested business category"
    when:
      fact: category
      present: true

  # Retained deliberately although it can never fire under the zero-cost
  # constraint: no free source carries Google review counts, so the fact
  # stays unverified and the rule stays silent. Documenting the gap is more
  # honest than deleting the rule and pretending reviews were never wanted.
  - id: strong_reviews
    points: 10
    reason: "Well reviewed on Google"
    when:
      fact: google_review_count
      verified: true
