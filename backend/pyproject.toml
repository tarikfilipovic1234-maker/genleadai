[project]
name = "genleadai-backend"
version = "0.1.0"
description = "AI Lead Generation Agent - FastAPI backend"
requires-python = ">=3.12"

dependencies = [
    # web
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    # config & validation
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    # database
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    # data providers and enrichment
    "httpx>=0.27",
    "trafilatura>=1.12",
    "selectolax>=0.3.21",
    "pyyaml>=6.0",
    # logging
    "structlog>=24.4",
]

[project.optional-dependencies]
# Everything needed to actually call a model. Deliberately optional: the
# deployed instance serves recorded runs and installs the base set only, so it
# is not merely configured to avoid calling a model - it is incapable of it,
# because the client libraries are not present. That is the third independent
# mechanism enforcing the same invariant, alongside the config guard and the
# container image omitting Node.
agent = [
    "claude-agent-sdk>=0.1.0",
    # Used only by the hand-written Messages API runtime (AGENT_RUNTIME=manual).
    "anthropic>=1.0",
]

dev = [
    "genleadai-backend[agent]",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-timeout>=2.3",
    "aiosqlite>=0.20",
    "ruff>=0.8",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# No test in this suite touches the network, so any that runs for 30 seconds
# is deadlocked rather than slow. A hung suite is worse than a failing one:
# it gives no diagnosis and blocks CI until something times it out.
timeout = 30
